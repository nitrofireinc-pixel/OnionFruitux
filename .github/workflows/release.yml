name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install package build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Build RPM
        run: bash packaging/build-rpm.sh

      - name: Build Arch package
        run: docker run --rm -v "$PWD":/src -w /src archlinux:base bash packaging/build-arch.sh

      - name: Install the Debian package on Debian and Ubuntu
        run: |
          set -eu
          deb=$(echo dist/onionfruitux_*_all.deb)
          base=$(basename "$deb")
          for image in debian:bookworm ubuntu:24.04; do
            docker run --rm \
              -v "$PWD/dist:/dist:ro" \
              -v "$PWD/packaging/smoke.sh:/smoke.sh:ro" \
              "$image" bash /smoke.sh "/dist/$base"
          done

      - name: Install the RPM on Fedora and openSUSE
        run: |
          set -eu
          rpm=$(echo dist/onionfruitux-*.noarch.rpm)
          base=$(basename "$rpm")
          for image in fedora:41 opensuse/tumbleweed:latest; do
            docker run --rm \
              -v "$PWD/dist:/dist:ro" \
              -v "$PWD/packaging/smoke.sh:/smoke.sh:ro" \
              "$image" bash /smoke.sh "/dist/$base"
          done

      - name: Install the Arch package
        run: |
          set -eu
          pkg=$(echo dist/onionfruitux-*.pkg.tar.zst)
          base=$(basename "$pkg")
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/smoke.sh:/smoke.sh:ro" \
            archlinux:base bash /smoke.sh "/dist/$base"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/onionfruitux_*_all.deb
            dist/onionfruitux-*.noarch.rpm
            dist/onionfruitux-*.pkg.tar.zst
